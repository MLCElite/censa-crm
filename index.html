    histAdd(d,'Abend-Verteilung: als FIX bestätigt ('+name+')');
    dbPersist(d);
    markDirty('steuerung');render();
  }));
  host.querySelectorAll('[data-dsr]').forEach(b=>b.addEventListener('click',()=>{ // Runden-Empfänger an-/abwählen
    const name=b.dataset.dsr;
    DISPO_RSEL[name]=(DISPO_RSEL[name]===0)?1:0;
    const on=DISPO_RSEL[name]!==0;
    b.style.background=on?'var(--brand)':'';b.style.borderColor=on?'var(--brand)':'';b.style.color=on?'#fff':'';
    b.textContent=(on?'✓ ':'✗ ')+name+(b.dataset.tg==='1'?' 🤖':'');
  }));
  host.querySelectorAll('[data-dsgo]').forEach(b=>b.addEventListener('click',async()=>{
    const rolle=b.dataset.dsgo;
    const typ=rolle==='analyst'?'Analysen':'Beratungen';
    const sel=TEAM.filter(m=>hasRole(m,rolle)&&(DISPO_SEL[rolle]||{})[m.name]).map(m=>m.name);
    if(!sel.length){toast('Bitte zuerst die Namen anklicken, die Termine bekommen sollen');return;}
    const ts=dispoOffeneTermine().filter(t=>t.rolle===rolle);
    if(!ts.length){toast('Keine offenen '+typ+' mehr');markDirty('steuerung');render();return;}
    ts.sort((a,b2)=>{const pa=parseTermin(a.wann),pb=parseTermin(b2.wann);return (pa?pa.getTime():9e15)-(pb?pb.getTime():9e15);});
    const load={};sel.forEach(n=>load[n]=0);
    const plan=ts.map(t=>{const c=[...sel].sort((x,y)=>(load[x]-load[y])||COLL.compare(x,y));load[c[0]]++;return {t:t,name:c[0]};});
    const vorschau=sel.map(n=>n+': '+load[n]).join(' · ');
    if(!confirm(ts.length+' offene '+typ+(sel.length>1?' fair aufteilen auf:\n\n':' komplett zuteilen an:\n\n')+vorschau+'\n\nJede Person bekommt je Termin eine Aufgabe zum Annehmen (Urgenz nach 3 Std läuft automatisch; Externe sofort die Kalender-Einladung).'))return;
    b.disabled=true;b.textContent='Speichert…';
    const pend=dispoPending();
    const ge=[];
    plan.forEach(p=>{
      const t=p.t,name=p.name;
      const d=state.deals.find(x=>x.id===t.tid.replace(/_(ag|bg)$/,''));
      if(!d)return;
      const alt=(d[t.rolle]||'').trim();
      const pm=pend[d.id+'|'+t.rolle];
      if(alt&&!pm)return; // fest besetzt (angenommen oder manuell) – nicht anrühren
      if(alt&&pm){ // nicht angenommene Zuordnung ersetzen: alte Aufgabe schließen
        if(chatCol){try{chatCol.doc(pm._id).update({needAck:false,ersetzt:name});}catch(e){}}
        pm.needAck=false;
        histAdd(d,'Abend-Verteilung: nicht angenommene Zuordnung ('+alt+') neu vergeben');
      }
      d[t.rolle]=name;d.geprueft=true;
      if(t.rolle==='berater'&&d.stage==='Analyse & Doku')d.stage='Beratungstermin vereinbart';
      histAdd(d,'Abend-Verteilung (Sammel): '+(rolle==='analyst'?'Analyst':'Berater')+' → '+name);
      const nm=d.name||d.org||'—';
      if(externCal(d,t.rolle))chatSys('👤 '+(rolle==='analyst'?'Analyse':'Beratung')+' zugeordnet (EXTERN): '+nm+' → '+name+(t.wann?' ('+t.wann+')':'')+' – Einladung per Kalender',d);
      else chatSys('👤 '+(rolle==='analyst'?'Analyse':'Beratung')+' zugeordnet: '+nm+' → '+name+(t.wann?' ('+t.wann+')':'')+' – bitte annehmen!',d,name,rolle==='berater'?'beratung-zuord':'analyse-zuord');
      ge.push(d);
    });
    const ok=await dbPersistMany(ge);
    chatSys('🌙 Abend-Verteilung (Sammel): '+ge.length+' '+typ+' verteilt – '+vorschau+'.');
    DISPO_SEL[rolle]={};
    toast(ok?('✓ '+ge.length+' '+typ+' verteilt: '+vorschau):'Speichern fehlgeschlagen – bitte Seite neu laden und prüfen');
    markDirty('steuerung');render();
  }));
  wireTeamPanel(host);
  steuerungSecs(host); // Blöcke zu Reitern bündeln – zuletzt, damit alle Hörer schon verdrahtet sind
}

let chatCol=null, chatUnsub=null, CHAT=[];
const CHATSEEN='censa_chat_seen';
function chatName(){return ME?ME.name:(AUTH_USER?(AUTH_USER.email||'').split('@')[0]:'');}
async function chatPost(text,opts){
  if(MODE!=='db'||!chatCol||!text)return;
  const m={ts:new Date().toISOString(),von:chatName(),text:String(text).slice(0,1200)};
  if(opts&&opts.sys)m.sys=true;

  if(opts&&opts.ackWer){m.needAck=true;m.ackWer=String(opts.ackWer).slice(0,40);m.ackBy=[];}

function chatSys(text,d,ackWer,art){chatPost(text,{sys:true,dealId:d?d.id:null,dealName:d?(d.name||d.org||''):'',ackWer:ackWer||null,art:art||null});}
async function chatAck(id){
  if(!chatCol)return;
  const n=chatName();if(!n)return;
  // Beim Bestätigen einer Termin-Zuordnung: Kalender SOFORT vorbefüllt öffnen (Kunde + Mitarbeiter als Gäste)
  // – muss VOR dem await passieren, sonst blockt der Browser das Fenster
  const mcal=CHAT.find(x=>x._id===id);
  const myN=personNames(n);
  if(mcal&&mcal.dealId&&(mcal.art==='analyse-zuord'||mcal.art==='beratung-zuord')&&myN.includes((mcal.ackWer||'').trim().toLowerCase())){
    const dd2=state.deals.find(x=>x.id===mcal.dealId);
    const dt2=dd2?parseTermin(mcal.art==='analyse-zuord'?dd2.datumAG:dd2.datumBG):null;
    if(dd2&&dt2){
      const kunde=dd2.name||dd2.org||'Kunde';
      const title=(mcal.art==='analyse-zuord'?'Analyse: ':'Beratung: ')+kunde;
      const loc=[dd2.strasse,dd2.plz,dd2.ort].filter(Boolean).join(', ')||((dd2.notizen||'').indexOf('CENSA-Büro')>=0?'CENSA Büro, 1230 Wien':'');
      const maMail=teamMail(mcal.art==='analyse-zuord'?dd2.analyst:dd2.berater);
      const det='Tel: '+(dd2.telefon||'-')+(dd2.briefing?' | '+dd2.briefing:'');
      const haveTok=!!__gcalTok&&Date.now()<__gcalExp-60000;
      if(GCAL_CLIENT_ID&&haveTok){
        gcalInsert(title,dt2,60,det,loc,[dd2.email,OFFICE_MAIL]).then(ok=>{
          if(ok)toast('📅 Termin automatisch in deinen Google Kalender eingetragen'+(dd2.email?' – der Kunde hat die Einladung per E-Mail bekommen':' (keine Kunden-E-Mail hinterlegt – bitte nachtragen)'));
          else toast('📅 Automatisches Eintragen fehlgeschlagen – bitte in der Aufgaben-Box „Google-Kalender verbinden" neu klicken');
        });
      }else{
        // Noch nicht verbunden: Kalender-Tab sofort synchron öffnen (wird so nicht geblockt)
        window.open(calGoogle(title,dt2,det,loc,[dd2.email,maMail,OFFICE_MAIL]),'_blank');
        toast('📅 Kalender-Tab geöffnet – auf „Speichern" klicken! Tipp: Einmal „Google-Kalender verbinden" (in der Aufgaben-Box), dann passiert das ab sofort vollautomatisch');
      }
    }
  }
  try{await chatCol.doc(id).update({ackBy:firebase.firestore.FieldValue.arrayUnion(n)});}catch(e){toast('Bestätigen fehlgeschlagen');return;}
  const msg=CHAT.find(x=>x._id===id);
  if(msg&&!(msg.ackBy||[]).includes(n)){msg.ackBy=[...(msg.ackBy||[]),n];updateTodoBadge();updateChatLog();}
  const my=personNames(n);
  const isMe=x=>my.includes((x||'').trim().toLowerCase());
  // Kunden-Akte: Annahme einer Termin-Zuordnung dokumentieren
  if(msg&&(msg.art==='analyse-zuord'||msg.art==='beratung-zuord')&&msg.dealId&&isMe(msg.ackWer)){
    const da=state.deals.find(x=>x.id===msg.dealId);
    if(da){histAdd(da,'Zuordnung ANGENOMMEN ('+(msg.art==='beratung-zuord'?'Berater':'Analyst')+')');dbPersist(da);}
  }
  if(msg&&msg.art==='beratung-zuord'&&msg.dealId&&isMe(msg.ackWer)){
    const dd=state.deals.find(x=>x.id===msg.dealId);
    if(dd&&dd.status==='open'&&isMe(dd.berater)&&dd.stage==='Beratungstermin vereinbart'){
      dd.stage='Beratung / Angebot';dbPersist(dd);render();
      toast('Angenommen – Phase: Beratung / Angebot');
    }
  }
}

function updateChatLog(){

  if(MODE!=='db'){log.innerHTML='<div class="msg sys">Der Team-Chat ist aktiv, sobald du angemeldet bist.</div>';return;}

    const link=m.dealId?` <span class="lk" data-open="${esc(m.dealId)}">→ ${esc(m.dealName||'Lead')}</span>`:'';

      const by=m.ackBy||[];

      if(pend)ack+=`<div style="margin-top:3px;font-size:11px;color:var(--bad);font-weight:700">⏳ Warten auf Bestätigung von ${werLabel}</div>`;
      if(m._id&&!by.includes(meN)&&!m.declined){
        ack+=`<div style="margin-top:5px;display:flex;gap:6px;flex-wrap:wrap"><button class="mini-btn" data-ack="${esc(m._id)}" style="border-color:var(--good);color:var(--good)">✔ Gesehen &amp; bestätigt</button>`;
        if((m.art==='beratung-zuord'||m.art==='analyse-zuord')&&personNames(meN).includes((m.ackWer||'').trim().toLowerCase()))ack+=`<button class="mini-btn" data-dec="${esc(m._id)}" style="border-color:var(--bad);color:var(--bad)">✖ Ablehnen</button>`;
        ack+='</div>';
      }
    }
    if(m.ersetzt)ack+=`<div style="margin-top:3px;font-size:11px;color:var(--ink-3);font-weight:700">↪ Nicht angenommen – bei der Abend-Verteilung neu vergeben an ${esc(m.ersetzt)}</div>`;
    if(m.erledigt&&!m.needAck)ack+=`<div style="margin-top:3px;font-size:11px;color:var(--ink-3);font-weight:700">✔ Hinfällig – automatisch aufgeräumt (Zuordnung inzwischen erledigt)</div>`;
    if(m.sys)return `<div class="msg sys">${zeit} · ${esc(m.text)}${link}${ack}</div>`;
    const mine=m.von===meN;
    return `<div class="msg${mine?' me':''}"><div class="mh">${esc(m.von||'?')} · ${zeit}</div>${esc(m.text)}${link}${ack}</div>`;
  }).join(''):'<div class="msg sys">Noch keine Nachrichten – schreib die erste! Termin-Änderungen erscheinen hier automatisch.</div>';
  log.querySelectorAll('[data-open]').forEach(el=>el.addEventListener('click',()=>openModal(el.dataset.open)));
  log.querySelectorAll('[data-ack]').forEach(el=>el.addEventListener('click',()=>chatAck(el.dataset.ack)));
  log.querySelectorAll('[data-dec]').forEach(el=>el.addEventListener('click',()=>chatDecline(el.dataset.dec)));
  log.scrollTop=log.scrollHeight;
  const chatVisible=!document.getElementById('view-chat').classList.contains('hide');
  if(chatVisible)markChatSeen();else updateChatBadge();
}

let __todoShown=false;
/* v19.11-O (Melanies Meldung: „Aufgaben-Fenster poppt beim Anmelden nicht mehr auf"): Bisher wurde nur EINMAL geprüft –
   beim ersten Chat-Paket. Waren Team oder Kunden da noch nicht geladen, blieb das Fenster für die ganze Sitzung zu.
   Jetzt wird nach dem Anmelden bis zu 30 Sekunden lang geprüft, bis alle Daten da sind, und das Fenster öffnet sich,
   sobald es etwas gibt: Bestätigungen, Termine von heute, fehlende Termine oder liegen gebliebene Kunden – für ALLE. */
let __todoTimer=null,__todoTries=0;
function todoAutoOpen(){
  if(__todoShown||MODE!=='db'||!AUTH_USER)return;
  __todoTries++;
  const geladen=TEAM.length>0&&(state.deals.length>0||__todoTries>6); // Team + Kunden da (oder wirklich leere Datenbank)
  if(!geladen){if(__todoTries>15)__todoShown=true;return;}
  if(document.getElementById('ov').classList.contains('show')||document.getElementById('loginOv').classList.contains('show'))return; // nichts überdecken – später nochmal
  let etwas=false;
  try{etwas=myAcksOpen().length>0||doppelAufgaben().length>0||todayTermine().length>0||termineAm(1).length>0||terminAufgaben().length>0||liegenGeblieben().length>0;}catch(e){}
  if(etwas){__todoShown=true;openTodo(true);return;}
  if(__todoTries>4)__todoShown=true; // Daten sind da und es gibt nichts → kein leeres Fenster
}
function todoAutoStart(){
  if(__todoTimer)clearInterval(__todoTimer);
  __todoTries=0;
  __todoTimer=setInterval(()=>{if(__todoShown||__todoTries>15){clearInterval(__todoTimer);__todoTimer=null;return;}todoAutoOpen();},2000);
}

async function chatDecline(id){
  const msg=CHAT.find(x=>x._id===id);if(!msg||!chatCol)return;
  const n=chatName();if(!n)return;
  const grund=prompt('Kurzer Grund für die Ablehnung (optional):');
  if(grund===null)return;
  try{await chatCol.doc(id).update({ackBy:firebase.firestore.FieldValue.arrayUnion(n),declined:true});}catch(e){toast('Ablehnen fehlgeschlagen');return;}
  if(!(msg.ackBy||[]).includes(n))msg.ackBy=[...(msg.ackBy||[]),n];
  msg.declined=true;
  const role=msg.art==='beratung-zuord'?'berater':'analyst';
  const d=state.deals.find(x=>x.id===msg.dealId);
  let nm=msg.dealName||'—';
  const myD=personNames(n);

    if(myD.includes((d[role]||'').trim().toLowerCase())){d[role]='';histAdd(d,'Zuordnung ABGELEHNT ('+role+')'+(grund?': '+grund.slice(0,120):''));dbPersist(d);}

/* ---------- Wochenplan: persönlich (auto + manuell) und Team (IVP-Format) ---------- */
let wocheCol=null, WOCHE=[], WOCHE_WK='', __wOff=0, __wPerson='', __wTeam=false;
const WDAYS=['Mo','Di','Mi','Do','Fr','Sa','So'];
const WARTC={AG:'var(--firma)',BG:'var(--good)',MGT:'var(--warn)',EG:'#3A3FB0',KG:'#0E7490',TG:'#8E5BC0',PRIVAT:'#6b7280',INFO:'#64748b'};
function wkStart(off){const t=new Date();t.setHours(0,0,0,0);const day=(t.getDay()+6)%7;t.setDate(t.getDate()-day+off*7);return t;}
function wkKeyOf(dt){return dt.getFullYear()+'-KW'+String(isoWeek(dt)).padStart(2,'0');}
function fmtDM(dt){return String(dt.getDate()).padStart(2,'0')+'.'+String(dt.getMonth()+1).padStart(2,'0')+'.';}
function nameEq(a,b){return (a||'').trim().toLowerCase()===(b||'').trim().toLowerCase();}
/* v19.11-Q (Melanies Ansage): „Meine Termine" (Aufgaben-Fenster, Knopf oben, Telegram-Wochenübersicht) zeigen auch die
   Wochenplan-Einträge EG, MGT, KG, TG – nicht nur AG/BG aus den Kunden. Dafür werden diese und die nächste Woche
   beim Anmelden geladen und hier zwischengespeichert. Private Einträge bleiben draußen. */
const WCACHE={},WLIVE={};
async function loadWoche(wk){
  WOCHE_WK=wk;
  if(MODE!=='db'||!wocheCol){WOCHE=[];return;}
  try{
    const s=await wocheCol.where('wk','==',wk).limit(600).get();
    WOCHE=s.docs.map(x=>{const o=Object.assign({},x.data());o._id=x.id;return o;});
  }catch(e){WOCHE=[];toast('Wochenplan konnte nicht geladen werden'+(e&&e.code?' ('+e.code+')':''));}
  if(!WLIVE[wk])WCACHE[wk]=WOCHE;
}
function wochePreload(){ // beim Anmelden: diese + nächste Woche mitlesen (live – neue Einträge erscheinen von selbst)
  if(MODE!=='db'||!wocheCol)return;
  [0,1].forEach(off=>{
    const wk=wkKeyOf(wkStart(off));
    if(WLIVE[wk])return;
    const neu=s=>{
      const vorher=termineSig();
      WCACHE[wk]=s.docs.map(x=>{const o=Object.assign({},x.data());o._id=x.id;return o;});
      try{updateTodoBadge();}catch(e){}
      // Aufgaben-Fenster ist gerade offen und die Termine haben sich geändert → neu zeichnen
      try{const m=document.getElementById('modal'),h=m&&m.querySelector('h2');
        if(h&&/Deine offenen Aufgaben/.test(h.textContent)&&document.getElementById('ov').classList.contains('show')&&termineSig()!==vorher)openTodo(true);}catch(e){}
    };
    try{
      const q=wocheCol.where('wk','==',wk).limit(600);
      if(q.onSnapshot){WLIVE[wk]=q.onSnapshot(neu,()=>{WLIVE[wk]=null;});}
      else q.get().then(neu).catch(()=>{});
    }catch(e){}
  });
}
function wocheDaten(wk){return (WLIVE[wk]&&WCACHE[wk])?WCACHE[wk]:(WOCHE_WK===wk?WOCHE:(WCACHE[wk]||[]));}
function termineSig(){try{return [0,1].map(o=>termineAm(o).map(e=>e.art+e.zeit+e.kunde).join('|')).join('#');}catch(e){return '';}}
function termineAm(off){ // eigene Termine an einem Tag (0 = heute, 1 = morgen): AG/BG aus den Kunden + EG/MGT/KG/TG aus dem Wochenplan
  const me=chatName();if(!me)return [];
  const h=new Date();const tag=new Date(h.getFullYear(),h.getMonth(),h.getDate()+off);
  const start=new Date(tag.getFullYear(),tag.getMonth(),tag.getDate()-((tag.getDay()+6)%7));
  const ti=(tag.getDay()+6)%7,wk=wkKeyOf(start);
  return wEntriesFor(me,start,wk,wocheDaten(wk)).filter(e=>e.tag===ti&&e.art!=='PRIVAT'&&!(e.mitschau&&e.dabei===0)&&e.status!=='cancelled'&&e.status!=='moved')
    .sort((a,b)=>(a.zeit||'').localeCompare(b.zeit||''));
}
function autoEntries(person,start){
  const end=new Date(start.getTime()+7*86400000);
  const pn=personNames(person);

async function pdfText(file){ // PDF im Browser lesen (pdf.js); Foto-Scans haben keinen Text -> ''
  try{
    if(!window.pdfjsLib)return '';
    pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const doc=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
    let t='';
    for(let p=1;p<=Math.min(doc.numPages,25);p++){
      const c=await (await doc.getPage(p)).getTextContent();
      t+=' '+c.items.map(it=>it.str).join(' ');
    }
    return t;
  }catch(e){return '';}
}

function kdParse(tx){ // „Kundendaten"-Seite der Analyse auslesen (nur digital ausgefüllte PDFs – Foto-Scans haben keinen Text)
  if(!tx||!/kundendaten/i.test(tx))return null;
  const seg=tx.slice(tx.search(/kundendaten/i));
  const teile=seg.split(/partner(?:in|\/in|\b)/i);
  const eins=t=>{
    const o={};
    // Wert endet am nächsten Formular-Label oder Doppel-Leerzeichen (Blockgrenze im PDF-Textstrom)
    const bis='(?=\\s{2}|\\s(?:Geburts|Adress|Anschrift|Telefon|Handy|Mobil|E-?Mail|Beruf|SVNr|Stra(?:ß|ss)e)|$)';
    let m=new RegExp('(?:vor-?\\s?(?:und|u\\.)\\s?)?(?:zu|nach|familien)?name[^:]{0,16}:\\s*([A-Za-zÄÖÜäöüß][\\wäöüß.\\- ]{1,48}?)'+bis,'i').exec(t);
    if(m)o.name=m[1].trim();
    m=/geb(?:urtsdatum|urtstag|\.)?[^0-9]{0,18}(\d{1,2}[./]\s?\d{1,2}[./]\s?\d{2,4})/i.exec(t);
    if(m)o.geb=m[1].replace(/\s/g,'');
    m=/(?:telefon|handy|mobil|tel\.?)[^0-9+]{0,14}((?:\+43|0)[\d\s/()\-]{6,18}\d)/i.exec(t);
    if(m)o.tel=m[1].trim();
    m=/([\w.+\-]+@[\w\-]+\.[a-z]{2,})/i.exec(t);
    if(m)o.email=m[1];
    m=new RegExp('(?:adresse|anschrift|wohnadresse|stra(?:ß|ss)e(?:\\s?/?\\s?nr\\.?)?)[^:]{0,12}:\\s*([A-Za-zÄÖÜäöüß][\\wäöüß .\\-]{1,40}?\\s?\\d+[a-zA-Z]?(?:/[\\w.]+)*)(?:[,\\s]+(\\d{4})\\s+([A-Za-zÄÖÜ][\\wäöüß.\\-]+))?','i').exec(t);
    if(m){o.strasse=m[1].trim();if(m[2]){o.plz=m[2];o.ort=(m[3]||'').trim();}}
    return o;
  };
  const kd=eins(teile[0]);
  if(teile.length>1){const p=eins(teile.slice(1).join(' '));if(p.name||p.geb)kd.partner=p;}
  return (kd.name||kd.geb||kd.tel||kd.email||kd.strasse)?kd:null;
}

function b64u8(s){return btoa(unescape(encodeURIComponent(s)));}
async function astVmB64(id){ // Vollmacht-Datei (Jeder-mit-Link-lesbar) als Base64 für den Mail-Anhang holen
  const r=await fetch('https://www.googleapis.com/drive/v3/files/'+id+'?alt=media&key='+FIREBASE_CONFIG.apiKey);
  if(!r.ok)throw new Error('Vollmacht-Download fehlgeschlagen');
  const b=new Uint8Array(await r.arrayBuffer());
  let s='';for(let i=0;i<b.length;i+=8192)s+=String.fromCharCode.apply(null,b.subarray(i,i+8192));
  return btoa(s);
}

function astMime(d,hdr,text,att){ // kompletter Mail-Rohbau (für Gmail-Entwurf UND .eml-Datei); hdr={to?,cc?,bcc?}

    lg.length?('\n🕰 Bitte dranbleiben – seit über 2 Wochen nichts passiert:\n'+lg.slice(0,12).map(x=>'• '+(x.d.name||x.d.org||'—')+' ('+x.d.stage+(x.tage>=0?', seit '+x.tage+' Tagen':'')+')').join('\n')+(lg.length>12?'\n… und '+(lg.length-12)+' weitere':'')):''].filter(Boolean).join('\n');

/* v18.11-C (Melanies Meldung 18.11.: „Termin steht doppelt/dreifach im Wochenplan"):

const KD_STOP=new Set(['gmbh','gesmbh','ges','mbh','kg','og','co','keg','ohg','e.u','eu','und','the','der','die','das','herr','hr','frau','fr','familie','fam','dr','mag','ing','dipl','dkfm','prof','bsc','msc','mba','termin','analyse','beratung','kunde','firma','fa','bei','mit','von','neu']);
function kdTokens(s){ // Kundenname → Wort-Menge ohne Rechtsform/Anrede/Titel
  return [...new Set((s||'').toLowerCase().replace(/ges\.?\s?m\.?\s?b\.?\s?h\.?/g,' ').replace(/&\s?co\.?/g,' ').replace(/e\.\s?u\./g,' ')
    .split(/[^a-z0-9äöüß]+/).filter(t=>t.length>=3&&!KD_STOP.has(t)))];

function kdSub(a,b){ // kleinere Wort-Menge steckt vollständig in der größeren? → Anzahl gemeinsamer Wörter, sonst 0
  if(!a.length||!b.length)return 0;

  return k.every(t=>g.includes(t))?k.length:0;

function kundeGleich(x,y){return kdSub(kdTokens(x),kdTokens(y))>0;}
/* v19.11-Z3: Kalender-Einträge, die nur eine Notiz zum Kunden sind („BG follow up Balint", „Info Huber", „Rückruf Maier"):
   KAL_INFO erkennt sie, kalName() holt den reinen Kundennamen heraus („follow up Balint" → „Balint"). */
const KAL_INFO_W="follow[\\s-]?ups?|f\\/u|fu|infos?|erinnerung|reminder|nachfassen|nachhaken|r(?:ü|ue)ckruf|wiedervorlage|wv|notiz|to[\\s-]?do|nur f(?:ü|ue)r mich";
const KAL_INFO=new RegExp("(^|[^a-zäöüß0-9])("+KAL_INFO_W+")(?![a-zäöüß0-9])","i");
const KAL_FUELL=new RegExp("(^|[^a-zäöüß0-9])("+KAL_INFO_W+"|folgetermin|nachtermin|zweittermin|folge|nachbesprechung|besprechung|unterschrift|abschluss|servicetermin|service|jahresgespr(?:ä|ae)ch|gespr(?:ä|ae)ch|telefonat|call|online|zoom|teams|vor ort|wegen|bzgl|betreff)(?![a-zäöüß0-9])","gi");
function kalInfo(s){return KAL_INFO.test(String(s||''));}
function kalName(s){return String(s||'').replace(KAL_FUELL,'$1 ').replace(/\s{2,}/g,' ').replace(/^[\s:\-–,.\/()]+|[\s:\-–,.\/()]+$/g,'');}

function evMails(ev){

function leadFuerKalender(ev,kunde,dt,deals,person){
  const Ts=[kdTokens(kunde)],Tc=kdTokens(kalName(kunde)),tel=evDigits(ev),mails=evMails(ev);
  if(Tc.length&&Tc.join(' ')!==Ts[0].join(' '))Ts.push(Tc); // „follow up Balint" zusätzlich als „Balint" prüfen
  const pn=person?personNames(person):[];
  const eigen=d=>pn.length>0&&[d.analyst,d.berater,d.telefonist,d.mgtAG,d.mgtBG].some(x=>pn.includes((x||'').trim().toLowerCase()));
  const plz=(/\b([1-9]\d{3})\b/.exec(ev.location||'')||[])[1]||'';
  const tag=x=>{const p=parseTermin(x);return p?p.getFullYear()*10000+p.getMonth()*100+p.getDate():0;};
  const evTag=dt.getFullYear()*10000+dt.getMonth()*100+dt.getDate();
  let hit=deals.find(d=>d.gcalId&&d.gcalId===ev.id);if(hit)return {d:hit,aehnlich:[]};
  if(mails.length){hit=deals.find(d=>(d.email||'').trim()&&mails.includes((d.email||'').trim().toLowerCase()));if(hit)return {d:hit,aehnlich:[]};}
  if(tel.length){hit=deals.find(d=>{const x=(d.telefon||'').replace(/\D/g,'');return x.length>=7&&tel.includes(x.slice(-7));});if(hit)return {d:hit,aehnlich:[]};}

  for(const d of deals){
    const K=kdTokD(d);let n=0,exakt=false;
    for(const T of Ts)for(const D of [K.tn,K.to]){const c=kdSub(T,D);if(c>n)n=c;if(c&&D.length===T.length&&c===T.length)exakt=true;}
    if(!n)continue;
    const beleg=tag(d.datumAG)===evTag||tag(d.datumBG)===evTag||(plz&&(d.plz||'').trim()===plz);
    if(exakt||n>=2||beleg){const sc=(exakt?100:0)+n*10+(beleg?5:0)+(d.status==='open'?1:0);if(sc>bestN){best=d;bestN=sc;}}
    else{aehnlich.push(d.name||d.org||'');if(eigen(d))eig.push(d);}
  }
  // v19.11-Z3: nur EIN Wort gleich („Balint" ↔ „Balint Peter"), aber der Kalender gehört jemandem, der genau EINEN
  // eigenen Kunden mit diesem Namen hat → das ist derselbe Kunde (kein zweiter Lead)

function gcalArt(title){
  const t=(title||'').trim();
  const m=t.match(/^(AG|BG|MGT|EG|KG|TG|PRIVAT)\b[\s:\-–]*/i);
  if(m)return {art:m[1].toUpperCase(),rest:t.slice(m[0].length).trim()};
  // v18.11-D (Melanies Ansage 18.11.): Kürzel darf auch HINTEN stehen – „Peschek BG", „Peschek – AG", „Peschek (BG)"
  const m2=t.match(/^(.*[^\s:\-–,(\/])[\s:\-–,(\/]+(AG|BG)\)?\s*$/i);
  if(m2&&m2[1].trim().length>=2)return {art:m2[2].toUpperCase(),rest:m2[1].trim(),suffix:true};
  return {art:'PRIVAT',rest:t};
}

    const dt=hasTime?new Date(ev.start.dateTime):new Date(ev.start.date+'T00:00:00');

    seen.add(id);

/* v19.11-R (Melanies Ansage): GP-Kandidaten nach ihrer Lage ordnen – wer am schlechtesten dasteht, steht oben.
   Grundlage sind NUR die öffentlichen Belastungssignale, die die Recruiting-Suche gefunden hat (Text „SIGNAL: …" in den
   Notizen bzw. die Felder signalTyp / ek / bilanz aus dem Briefkasten). Kein Signal heißt: nichts gefunden, nicht „geht gut". */
function gpZahl(s){
  if(s==null||s==='')return null;
  const m=(''+s).replace(/[−–]/g,'-').replace(/\s/g,'').match(/-?\d[\d.]*(?:,\d+)?/);if(!m)return null;
  const v=parseFloat(m[0].replace(/\./g,'').replace(',','.'));return isNaN(v)?null:v;
}
function gpLage(d){
  const txt=(d.notizen||'');
  const sig=((txt.match(/SIGNAL:\s*([^|\n]+)/i)||[])[1]||'').trim();
  const low=sig.toLowerCase(),tier=(d.signalTyp||'').toUpperCase();
  const jahr=new Date().getFullYear();
  const T_INS='Sensibel vorgehen: über Neustart und den bestehenden Kundenstamm sprechen. Das Verfahren nicht ansprechen.';
  const T_ZAHL='Über Wachstumschance, Entlastung und ein zusätzliches Standbein sprechen. Die Finanzlage nie erwähnen.';
  const T_SOFT='Über Entlastung vom Einzelkämpfer-Dasein und das Thema Nachfolge/Partnerschaft sprechen.';
  const out=(score,kurz,tipp,art)=>({score:Math.round(score),kurz,tipp:(d.gpTipp||tipp||''),sig,art,
    stufe:score>=85?3:score>=60?2:score>=20?1:0});
  if(/KOOPERATION:/i.test(txt)||tier==='KOOPERATION')return Object.assign(out(0,'Kooperationspartner','', 'koop'),{koop:true});
  const jahre=(sig.match(/\b(?:19|20)\d\d\b/g)||[]).map(Number).filter(y=>y<=jahr+1);
  const maxJ=jahre.length?Math.max(...jahre):0;
  if(/insolvenz|konkurs|sanierungsverfahren|masseverwalter/.test(low)||tier==='B'){
    const alt=maxJ?jahr-maxJ:(/laufend|eröffnet/.test(low)?0:3);
    if(alt<=2)return out(100,'Insolvenzverfahren'+(maxJ?' ('+maxJ+')':' läuft'),T_INS,'ins');
    if(alt<=5)return out(70,'Insolvenzverfahren '+maxJ,T_INS,'ins');
    return out(45,'Früheres Insolvenzverfahren ('+maxJ+')',T_INS,'ins');
  }
  let ek=gpZahl(d.ek);
  if(ek==null){const m=sig.match(/eigenkapital[^0-9\-−]{0,30}([-−]\s?[\d.]+(?:,\d+)?)/i);if(m)ek=gpZahl(m[1]);}
  const fj=d.finanzJahr?' ('+d.finanzJahr+')':'';
  if(ek!=null&&ek<0){
    if(/erholt|aktuell wieder|wieder positiv/.test(low))return out(30,'Früher negatives Eigenkapital, inzwischen erholt',T_ZAHL,'zahl');
    return out(75+Math.min(15,Math.max(0,Math.log10(Math.abs(ek)/1000))*5),'Eigenkapital '+Math.round(ek).toLocaleString('de-AT')+' €'+fj,T_ZAHL,'zahl');
  }
  const gw=gpZahl(d.gewinn);
  if(/negatives eigenkapital/.test(low))return out(78,'Negatives Eigenkapital'+fj,T_ZAHL,'zahl');
  if(/bilanzverlust|niedriges eigenkapital|verlust/.test(low)||(gw!=null&&gw<0))return out(62,(/niedriges eigenkapital/.test(low)?'Sehr niedriges Eigenkapital, Bilanzverlust':'Bilanzverlust')+fj,T_ZAHL,'zahl');
  if(tier==='A'&&!sig)return out(75,'Schwache Bilanz laut Recherche',T_ZAHL,'zahl');
  if(/nachfolger? gesucht|nachfolgeb(ö|oe)rse/.test(low))return out(45,'Sucht Nachfolger',T_SOFT,'soft');
  if(sig||tier==='C'||tier==='A'){
    const pk=[[/kein[^.]{0,40}webauftritt|veraltet/, 'kein aktueller Webauftritt'],[/ruhend/,'Berechtigung ruhend gemeldet'],[/widersprüchlich/,'widersprüchliche Adressen'],[/nachfolge|pensionierung/,'Nachfolge-Thema'],[/einzelk(ä|ae)mpfer|einzelunternehm/,'Einzelkämpfer']];
    const tref=pk.filter(x=>x[0].test(low)).map(x=>x[1]);
    const seit=(sig.match(/seit (?:\d\d\.\d\d\.)?((?:19|20)\d\d)/i)||[])[1];
    return out(25+Math.min(15,tref.length*5),(tref.slice(0,2).join(', ')||sig.slice(0,60)||'Soft-Signal')+(seit?' · seit '+seit:''),T_SOFT,'soft');
  }
  return out(0,'','', '');
}

const ZUORD_URGENZ_STD=3;

  return CHAT.filter(m=>(m.art==='analyse-zuord'||m.art==='beratung-zuord')&&m.needAck&&!m.declined&&!(m.ackBy||[]).some(n=>same(n,m.ackWer)));

    const alterTxt=std<1?Math.max(1,Math.round(alterMs/60000))+' Min':(Math.round(std*10)/10+' Std');
    const typ=m.art==='beratung-zuord'?'Beratung':'Analyse';
    const st=m.urgiert?'<span class="tg od">🔴 urgiert – wartet weiter</span>':(std>=ZUORD_URGENZ_STD?'<span class="tg od">🔴 über 3 Std offen</span>':`<span class="tg" style="background:var(--warn);color:#fff">⏳ wartet (Urgenz in ${Math.max(1,Math.round((ZUORD_URGENZ_STD-std)*60))} Min)</span>`);

  }).join('');
  return `<div class="panel" style="border-color:${offen.some(m=>m.urgiert||((Date.now()-new Date(m.ts||0).getTime())/3600000)>=ZUORD_URGENZ_STD)?'var(--bad)':'var(--line)'}"><h3>⏳ Zuordnungs-Status <span style="color:var(--ink-3);font-weight:600;text-transform:none;letter-spacing:0">— jede Termin-Zuordnung, bis Analyst/Berater annimmt oder ablehnt · nach ${ZUORD_URGENZ_STD} Std ohne Reaktion geht automatisch eine Urgenz an die Person und eine Info an dich</span></h3>${offen.length?`<div class="st-list">${rows}</div>`:'<div class="empty-col">Alle Zuordnungen angenommen 👍</div>'}</div>`;

let __putzLast=0;
async function aufgabenPutz(){ // Melanies Ansage 10.11.: hinfällige Urgenz-/Info-Aufgaben SELBST aufräumen, sobald die Zuordnung erledigt ist
  if(!isAdmin()||MODE!=='db'||!chatCol)return;
  if(Date.now()-__putzLast<60000)return; // höchstens 1× pro Minute
  __putzLast=Date.now();
  const pend=dispoPending();
  let n=0;
  for(const m of CHAT){
    if(!m.needAck||m.declined||!m.dealId)continue;
    const t=m.text||'';
    const urg=t.indexOf('❗ URGENZ an ')===0;
    const inf=t.indexOf('ℹ️ ')===0&&t.indexOf('Urgenz wurde automatisch geschickt')>=0;
    const abg=t.indexOf('🚫 NICHT angenommen: ')===0; // Ablehnungs-Hinweis „bitte neu zuordnen"
    if(!urg&&!inf&&!abg)continue;
    let weg=false;
    if(urg||inf){
      const rolle=t.indexOf('Beratung-Zuordnung')>=0?'berater':'analyst';
      weg=!pend[m.dealId+'|'+rolle]; // Original-Zuordnung erledigt/ersetzt/abgelehnt → Urgenz hinfällig
    }else{
      const rolle=t.indexOf('NICHT angenommen: Beratung')>=0?'berater':'analyst';
      const dd=state.deals.find(x=>x.id===m.dealId);
      weg=!!(dd&&(dd[rolle]||'').trim()); // inzwischen neu zugeordnet → „bitte neu zuordnen" hinfällig
    }
    if(!weg)continue;
    try{await chatCol.doc(m._id).update({needAck:false,erledigt:'auto'});}catch(e){continue;}
    m.needAck=false;m.erledigt='auto';n++;
  }
  if(n){
    updateTodoBadge();updateChatLog();
    const mo=document.getElementById('modal'); // offene Aufgaben-Box sofort mit-aktualisieren
    if(document.getElementById('ov').classList.contains('show')&&mo&&mo.innerHTML.indexOf('Deine offenen Aufgaben')>=0)openTodo(true);
  }
}
let __zuordLast=0;
async function zuordUrgenz(){
  if(!isAdmin()||MODE!=='db'||!chatCol)return;
  if(Date.now()-__zuordLast<15*60000)return; // höchstens alle 15 Min prüfen
  __zuordLast=Date.now();
  for(const m of zuordOffen()){
    if(m.urgiert)continue;
    const std=(Date.now()-new Date(m.ts||0).getTime())/3600000;
    if(std<ZUORD_URGENZ_STD)continue;

function dispoPending(){ // dealId|rolle → noch nicht angenommene Zuordnungs-Nachricht (kommt wieder in den Abend-Topf)
  const p={};

async function dispoResume(){
  if(DISPO_R||__dispoLoading||MODE!=='db'||!isAdmin())return;
  let rid='';try{rid=localStorage.getItem('censa_dispo_rid')||'';}catch(e){}

      try{await firebase.firestore().collection('dispoRunden').doc(rid).update({offen:false});}catch(e){}

      markDirty('steuerung');render();

    else if(data&&data.offen!==false){DISPO_R=Object.assign({id:rid},data);await dispoLadeAntworten();markDirty('steuerung');render();}
    else{try{localStorage.removeItem('censa_dispo_rid');}catch(e){}}

async function dispoLadeAntworten(){

function dispoMatrix(){ // je Person+Termin zählt die LETZTE Antwort
  const last={};DISPO_ANT.forEach(a=>{const k=(a.tok||'')+'|'+(a.tid||'');if(!last[k]||(a.ts||'')>(last[k].ts||''))last[k]=a;});
  const m={};Object.values(last).forEach(a=>{const e=(m[a.tid]=m[a.tid]||{ja:[],nein:[]});(a.kann==='ja'?e.ja:e.nein).push(a.name||a.tok);});
  return m;
}
function dispoFair(termine,mx){ // knappe Termine zuerst; dann an die Person mit der geringsten Auslastung
  const load={},zu={},offenT=[];
  const ts=[...termine].sort((a,b)=>((mx[a.tid]||{ja:[]}).ja.length)-((mx[b.tid]||{ja:[]}).ja.length));
  ts.forEach(t=>{
    const c=[...new Set((mx[t.tid]||{ja:[]}).ja)];
    if(!c.length){offenT.push(t);return;}
    c.sort((a,b)=>((load[a]||0)-(load[b]||0))||a.localeCompare(b));
    zu[t.tid]=c[0];load[c[0]]=(load[c[0]]||0)+1;
  });
  return {zu:zu,offenT:offenT,load:load};
}

    if(alt&&pm){ // nicht angenommene Zuordnung ersetzen: alte Aufgabe schließen

      pm.needAck=false;

}
function baumPanel(){ // 🌳 Team-Linien: Hierarchie aus „direkte Führungskraft" + Monats-Ist je Person und Linie
  if(!isAdmin()||MODE!=='db'||!TEAM.length)return '';
  const now=new Date();
  const monKey=now.getFullYear()+'-'+calPad(now.getMonth()+1);
  const inM=ds=>{const dt=parseTermin(ds);return !!(dt&&dt.getMonth()===now.getMonth()&&dt.getFullYear()===now.getFullYear());};
  const ehIst=ehMonat(monKey);
  const ist={};TEAM.forEach(m=>ist[m.name]={ag:0,bg:0,eh:ehIst[m.name]||0});
  state.deals.forEach(d=>{
    if((d.quelle||'')==='Recruiting')return;
    const an=canonName(d.analyst||''),be=canonName(d.berater||'');
    if(an&&ist[an]&&inM(d.datumAG))ist[an].ag++;
    if(be&&ist[be]&&inM(d.datumBG))ist[be].bg++;
  });
  const kids={};TEAM.forEach(m=>{const f=canonName(m.fk||'');if(f)(kids[f]=kids[f]||[]).push(m);});
  const names=new Set(TEAM.map(m=>m.name));
  const roots=TEAM.filter(m=>!(m.fk||'').trim()||!names.has(canonName(m.fk||'')));
  const linie=(m,seen)=>{ // Person + komplette Downline (Zyklus-Schutz)
    if(seen.has(m.id))return [];
    seen.add(m.id);
    const out=[m];(kids[m.name]||[]).forEach(c=>out.push(...linie(c,seen)));
    return out;
  };
  const row=(m,tiefe,seen)=>{
    if(seen.has(m.id))return '';
    seen.add(m.id);
    const i=ist[m.name]||{ag:0,bg:0,eh:0};
    const z=(m.ziele&&m.ziele.monat===monKey)?m.ziele:null;
    const ln=linie(m,new Set());
    const lAg=ln.reduce((s,x)=>s+((ist[x.name]||{}).ag||0),0),lBg=ln.reduce((s,x)=>s+((ist[x.name]||{}).bg||0),0),lEh=ln.reduce((s,x)=>s+((ist[x.name]||{}).eh||0),0);
    const ehChip=(istW,ziel)=>{const er=ziel&&istW>=ziel;return `<span class="tg"${er?' style="background:var(--good);color:#fff"':''}>EH ${fmtEH(istW)}${ziel?' / Ziel '+esc(ziel):''}${er?' ✔':''}</span>`;};
    return `<div class="gl" style="cursor:default;flex-wrap:wrap;margin-left:${Math.min(tiefe,4)*22}px">${tiefe?'<span class="ph">↳</span>':''}<span class="gn">${esc(m.name)}</span><span class="ph">${esc(m.rolle||'')}</span>${z?`<span class="tg">🎯 ${esc(z.agt||0)} AGT/Wo · ${esc(z.ehE||0)} EH eigen · ${esc(z.ehT||0)} EH Team</span>`:'<span class="ph">— kein Monatsziel —</span>'}<span class="tg" style="background:var(--brand);color:#fff">Monat: AG ${i.ag} · BG ${i.bg}</span>${ehChip(i.eh,z?z.ehE:0)}${ln.length>1?`<span class="tg">Linie (${ln.length-1} GP): AG ${lAg} · BG ${lBg}</span>`:''}${ln.length>1?ehChip(lEh,z?z.ehT:0).replace('>EH ','>Linie-EH '):''}</div>`
      +(kids[m.name]||[]).map(c=>row(c,tiefe+1,seen)).join('');
  };
  const seen=new Set();
  const body=roots.map(r=>row(r,0,seen)).join('');
  return `<div class="panel"><h3>🌳 Team-Linien <span style="color:var(--ink-3);font-weight:600;text-transform:none;letter-spacing:0">— direkte und indirekte GPs (aus „Führungskraft" in Team &amp; Zugänge) · je Person Monatsziel (ZVG), Termine und EH diesen Monat, je Linie die Summe · EH-Aufteilung wie im Kunden-Fenster: Berater 50 %, Analyst 50/25 %, Telefonist 25 %</span></h3><div class="st-list">${body||'<div class="empty-col">In Team &amp; Zugänge bei jedem Mitglied die direkte Führungskraft wählen – dann baut sich der Baum automatisch.</div>'}</div>
    <div style="font-size:11px;color:var(--ink-3);margin-top:6px">EH-Monatszahlen zählen ab jetzt: Abschluss-Einträge bekommen seit heute automatisch ein Datum – ältere Einträge ohne Datum fließen bewusst nicht ein (keine erfundenen Zahlen).</div></div>`;
}

async function ehgBook(id,dateStr,zeit){
  const mm=TEAM.find(x=>x.id===id);if(!mm)return;
  if(!dateStr){toast('Bitte zuerst ein Datum wählen');return;}
  if(!zeit){toast('Bitte eine Uhrzeit wählen');return;}
  if(MODE!=='db'||!wocheCol||!teamCol){toast('Nur online möglich');return;}
  const dt=new Date(dateStr+'T00:00:00');
  const wk=wkKeyOf(dt);
  const tag=(dt.getDay()+6)%7;
  const mk=name=>({wk,name,tag,zeit,art:'MGT',kunde:'Erwartungshaltungsgespräch '+(name===mm.name?'mit '+chatName():'mit '+mm.name),ort:'',status:'',ts:new Date().toISOString()});
  try{
    const b=firebase.firestore().batch();
    const i1='w'+Date.now().toString(36)+'ea',i2='w'+Date.now().toString(36)+'eb';
    b.set(wocheCol.doc(i1),mk(mm.name));
    b.set(wocheCol.doc(i2),mk(chatName()));
    b.update(teamCol.doc(mm.id),{ehg:dateStr,ehgRemind:''});
    await b.commit();
    mm.ehg=dateStr;mm.ehgRemind='';
    if(wk===WOCHE_WK){WOCHE.push(Object.assign({_id:i1},mk(mm.name)));WOCHE.push(Object.assign({_id:i2},mk(chatName())));}
    chatSys('🗓 Erwartungshaltungsgespräch eingebucht: '+mm.name+' & '+chatName()+' am '+dateStr.split('-').reverse().join('.')+' um '+zeit+' – bitte bestätigen!',null,mm.name);
    toast('Eingebucht – steht bei euch beiden im Wochenplan, '+mm.name+' wurde informiert');
    renderSteuerung();
  }catch(e){toast('Einbuchen fehlgeschlagen'+(e&&e.code?' ('+e.code+')':''));}
}
let __ehgChecked=false;
async function ehgAutoRemind(){
  if(__ehgChecked)return;__ehgChecked=true;
  return; // vorerst DEAKTIVIERT (31.10., Melanies Ansage): EHG-Erinnerungen an GPs pausiert – Thema nur für Melanie sichtbar. Zum Reaktivieren diese Zeile entfernen.
  if(!isAdmin()||MODE!=='db'||!teamCol||!chatCol)return;
  const today=todayStr();
  for(const mm of TEAM){
    if(hasRole(mm,'admin'))continue;
    const due=!mm.ehg||dayDiff(mm.ehg,today)>=90;
    const remOk=!mm.ehgRemind||dayDiff(mm.ehgRemind,today)>=7;
    if(due&&remOk){
      chatSys('🗓 '+mm.name+': Dein Erwartungshaltungsgespräch mit '+chatName()+' ist fällig (alle 3 Monate). Terminvorschläge: '+ehgSlots().join(' · ')+' – schreib im Chat, welcher passt, dann wird er fix für uns beide eingebucht.',null,mm.name);
      try{await teamCol.doc(mm.id).update({ehgRemind:today});mm.ehgRemind=today;}catch(e){}
    }
  }
}

function openCeoUpdate(){

  const open=state.deals.filter(d=>d.status==='open');
  const due=d=>daysUntil(d.wiedervorlage)!=null&&daysUntil(d.wiedervorlage)<=0;
  const lines=[];
  lines.push('CEO-Wochenupdate KW'+kw);
  lines.push('Gesamt: '+state.deals.length+' Datensätze · '+open.length+' offen');
  lines.push('');
  lines.push('— TELEFONISTEN (Anruf-Leads) —');
  grpBy(open.filter(d=>['Neuer Lead','In Bearbeitung'].includes(d.stage)),'telefonist','— ohne Zuteilung —').forEach(([t,l])=>{
    lines.push(t+': '+l.length+' offen · '+l.filter(due).length+' Rückrufe fällig');
  });
  lines.push('');
  lines.push('— ANALYSTEN (Analysen) —');
  grpBy(open.filter(d=>A_STAGES.includes(d.stage)),'analyst','— ohne Analyst —').forEach(([a,l])=>{
    lines.push(a+': '+l.length+' offen · '+l.filter(d=>d.stage==='Analyse & Doku'&&!(d.berater||'').trim()).length+' übergabereif · '+l.filter(due).length+' fällig');
  });
  lines.push('');
  lines.push('— BERATER (Beratungen) —');
  grpBy(open.filter(d=>B_STAGES.includes(d.stage)),'berater','— nicht zugeteilt —').forEach(([b,l])=>{
    lines.push(b+': '+l.length+' offen · '+l.filter(due).length+' überfällig');
  });
  const reakt=state.deals.filter(d=>d.status==='lost'&&d.lostReason==='Kein Interesse'&&(daysUntil(d.wiedervorlage)==null||daysUntil(d.wiedervorlage)<=0));
  lines.push('');
  lines.push('— REAKTIVIERUNG —');
  lines.push(reakt.length+' Kein-Interesse-Leads fällig zum Wiederanruf (2-Monats-Regel)');
  const urgent=open.filter(due).sort((a,b)=>daysUntil(a.wiedervorlage)-daysUntil(b.wiedervorlage)).slice(0,10);
  if(urgent.length){lines.push('');lines.push('— JETZT URGIEREN (Top '+urgent.length+') —');
    urgent.forEach(d=>{const who=d.stage==='Beratung / Angebot'||d.stage==='Beratungstermin vereinbart'?(d.berater||'Berater?'):A_STAGES.includes(d.stage)?(d.analyst||'Analyst?'):(d.telefonist||'Setter?');
      lines.push((d.name||d.org||'—')+' · '+d.stage+' · '+(-daysUntil(d.wiedervorlage))+' Tage überfällig → '+who);});}
  const txt=lines.join('\n');
  const m=document.getElementById('modal');m.classList.add('wide');
  m.innerHTML=`<h2>CEO-Wochenupdate</h2><div class="sub">KW${kw} · dein Urgieren-Briefing über alle Rollen</div>
    <div class="rep"><div class="rh">Update<button class="mini-btn" id="ceo-copy" style="margin-left:auto">Kopieren</button></div><pre>${esc(txt)}</pre></div>

/* v19.11-J (Melanies Ansage): Egal wie ein Termin getippt wird – gespeichert wird er einheitlich als „TT.MM.JJJJ HH:MM".
   Versteht u. a.: 22.9. 14 · 22.09 14:00 · 22/9/26 14h30 · 22.9.2026 14.00 · 2026-09-22 14:00 · morgen 10 Uhr · heute 9
   Rückgabe {txt, zeit:true/false} oder null (nicht erkannt). Fehlt das Jahr: laufendes Jahr; liegt das Datum damit mehr
   als ein halbes Jahr zurück, ist das nächste Jahr gemeint. */
function terminNorm(s){
  let t=(s||'').toLowerCase().replace(/\s+/g,' ').trim();if(!t)return null;
  const now=new Date();let hh=null,mi=0,m;
  const cut=mm=>{t=(t.slice(0,mm.index)+' '+t.slice(mm.index+mm[0].length)).replace(/\s+/g,' ').trim();};
  const datumDrin=x=>/\d{1,2}\s*[.\/-]\s*\d{1,2}|\d{4}-\d{1,2}-\d{1,2}|heute|morgen/.test(x);
  if((m=/(\d{1,2})\s*:\s*(\d{2})(\s*uhr)?/.exec(t))){hh=+m[1];mi=+m[2];cut(m);}
  else if((m=/(\d{1,2})\s*h\s*(\d{2})?\b/.exec(t))){hh=+m[1];mi=m[2]?+m[2]:0;cut(m);}
  else if((m=/(\d{1,2})(?:[.](\d{2}))?\s*uhr/.exec(t))){hh=+m[1];mi=m[2]?+m[2]:0;cut(m);}
  else if((m=/(?:^|\s)(\d{1,2})\.(\d{2})$/.exec(t))&&datumDrin(t.slice(0,m.index))){hh=+m[1];mi=+m[2];cut(m);}
  else if((m=/\s(\d{1,2})$/.exec(t))&&+m[1]<=23&&datumDrin(t.slice(0,m.index))){hh=+m[1];mi=0;cut(m);}
  if(hh!==null&&(hh>23||mi>59))return null;
  let y=null,mo,da;
  if((m=/\b(übermorgen|uebermorgen|morgen|heute)\b/.exec(t))){
    const b=new Date(now.getFullYear(),now.getMonth(),now.getDate()+({heute:0,morgen:1}[m[1]]===undefined?2:{heute:0,morgen:1}[m[1]]));
    y=b.getFullYear();mo=b.getMonth();da=b.getDate();
  }else if((m=/(\d{4})-(\d{1,2})-(\d{1,2})/.exec(t))){y=+m[1];mo=+m[2]-1;da=+m[3];}
  else if((m=/(\d{1,2})\s*[.\/-]\s*(\d{1,2})(?:\s*[.\/-]\s*(\d{4}|\d{2}))?/.exec(t))){
    da=+m[1];mo=+m[2]-1;
    if(m[3]){y=+m[3];if(y<100)y+=2000;}
  }else return null;
  if(y===null){y=now.getFullYear();if(new Date(y,mo,da,23,59).getTime()<now.getTime()-183*86400000)y++;}
  const dt=new Date(y,mo,da,hh===null?0:hh,mi);
  if(dt.getFullYear()!==y||dt.getMonth()!==mo||dt.getDate()!==da||y<2000||y>2100)return null; // 31.02. o. Ä.
  const P=n=>String(n).padStart(2,'0');
  return {txt:P(da)+'.'+P(mo+1)+'.'+y+(hh===null?'':' '+P(hh)+':'+P(mi)),zeit:hh!==null};
}
function gebNorm(s){ // Geburtsdatum → TT.MM.JJJJ (zweistelliges Jahr: 19xx, außer es liegt nicht in der Zukunft)
  const t=(s||'').trim();const m=/^(\d{1,2})\s*[.\/-]\s*(\d{1,2})\s*[.\/-]\s*(\d{4}|\d{2})$/.exec(t)||/^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(t);
  if(!m)return t;
  let da,mo,y;
  if(m[1].length===4){y=+m[1];mo=+m[2];da=+m[3];}else{da=+m[1];mo=+m[2];y=+m[3];if(y<100)y+=(y>(new Date().getFullYear()%100))?1900:2000;}
  const dt=new Date(y,mo-1,da);if(dt.getMonth()!==mo-1||dt.getDate()!==da)return t;
  return String(da).padStart(2,'0')+'.'+String(mo).padStart(2,'0')+'.'+y;
}
function parseTermin(s){
  s=(s||'').trim();if(!s)return null;
  const m=/(\d{1,2})\.(\d{1,2})\.?\s*(\d{2,4})?\D*?(?:(\d{1,2})[:.h](\d{2}))?\s*$/.exec(s)||/(\d{1,2})\.(\d{1,2})\.?\s*(\d{2,4})?(?:\D+?(\d{1,2})[:.h](\d{2}))?/.exec(s);
  if(!m)return null;
  const now=new Date();
  let y=m[3]?parseInt(m[3],10):now.getFullYear();
  if(y<100)y+=2000;
  const mo=parseInt(m[2],10)-1,da=parseInt(m[1],10);
  const hh=m[4]!=null?parseInt(m[4],10):9,mi=m[5]!=null?parseInt(m[5],10):0;
  if(mo<0||mo>11||da<1||da>31)return null;
  let dt=new Date(y,mo,da,hh,mi);
  if(!m[3]&&dt.getTime()<now.getTime()-86400000)dt=new Date(y+1,mo,da,hh,mi);
  return dt;
}

function liegenAlle(){ // alle Kunden in Arbeit, ohne Datum, seit >14 Tagen unbearbeitet – mit dem, der dran ist

function wireEH(m,d){
  d.ehS=d.ehS||[];d.ehA=d.ehA||[];
  buildAdd(m,d,'a');paintEH(m,d);
  const addS=it=>{it.ts=it.ts||new Date().toISOString();d.ehS.push(it);if(state.deals.includes(d))dbPersist(d);paintEH(m,d);toast('Schätzung hinzugefügt: '+fmtEH(calcEH(it))+' EH');};
  m.querySelectorAll('[data-q]').forEach(b=>b.addEventListener('click',()=>{
    const q=b.dataset.q;
    if(POT_STD[q]){ // Kurzform: eingetragener Monatsbetrag, sonst Standard-Durchschnitt
      const st=POT_STD[q],qb=m.querySelector('#q-betrag');
      const v=parseFloat(qb.value)||st.b;
      addS(Object.assign({k:st.k,betrag:v,zw:'m'},st.lz?{lz:st.lz}:{}));qb.value='';return;
    }
    if(q==='gg'){
      const s=parseFloat(m.querySelector('#q-summe').value);
      if(!s){toast('Bitte Zielsumme eingeben');return;}
      addS({k:'gg',betrag:s});
    }else{
      const v=parseFloat(m.querySelector('#q-betrag').value);
      if(!v){toast('Bitte Sparbetrag €/Monat eingeben');return;}
      addS(q==='bav'?{k:'bav_zukunft',betrag:v,zw:'m',lz:30}:{k:'lv_oebv',betrag:v,zw:'m',lz:30});
    }
  }));
  const vor=m.querySelector('#eh-vorschlag');
  if(vor&&!d.ehS.length){
    const txt=((d.potenzial||'')+' '+(d.briefing||'')+' '+(d.notizen||'')).toLowerCase();
    let mm=/(\d{2,5})\s*(?:€|eur[o]?)?\s*(?:im|pro|\/)?\s*monat/i.exec(txt)||/spar\w*\D{0,25}?(\d{2,5})/i.exec(txt)||/(\d{2,5})\D{0,20}spar/i.exec(txt);
    if(mm){
      const bet=parseFloat(mm[1]);
      if(bet>=30&&bet<=5000){
        const eh=calcEH({k:'lv_oebv',betrag:bet,zw:'m',lz:30});
        vor.innerHTML=`<div style="display:flex;gap:9px;align-items:center;flex-wrap:wrap;background:var(--brand-bg);border-radius:8px;padding:7px 10px;margin-top:7px;font-size:12.5px"><span>💡 Im Protokoll erkannt: <b>${bet} €/Monat sparen</b> → Veranlagung ≈ <b>${fmtEH(eh)} EH</b> (lt. IVP-Tabelle)</span><button type="button" class="mini-btn" id="eh-uebern">Übernehmen</button></div>`;
        const ub=vor.querySelector('#eh-uebern');
        if(ub)ub.addEventListener('click',()=>{addS({k:'lv_oebv',betrag:bet,zw:'m',lz:30});vor.innerHTML='';});
      }
    }
  }
}
function buildAdd(m,d,which){
  const host=m.querySelector('#eh-add-'+which);if(!host)return;
  const sel=document.createElement('select');sel.className='sel';
  sel.innerHTML='<option value="">Produkt wählen…</option>'+PROD.map(p=>`<option value="${p.k}">${p.n}</option>`).join('');
  const betrag=document.createElement('input');betrag.className='num';betrag.type='number';betrag.placeholder='Betrag €';
  const zw=document.createElement('select');zw.className='sm';zw.innerHTML='<option value="m">mtl.</option><option value="j">jährl.</option>';
  const lz=document.createElement('input');lz.className='sm';lz.type='number';lz.placeholder='LZ';
  const bag=document.createElement('input');bag.className='sm';bag.type='number';bag.placeholder='BAG';
  const btn=document.createElement('button');btn.className='mini-btn';btn.textContent='+ hinzufügen';
  const upd=()=>{const p=PRODMAP[sel.value];zw.style.display=(p&&!p.mode)?'':'none';lz.style.display=(p&&p.lz)?'':'none';bag.style.display=(p&&p.mode==='fin')?'':'none';if(p&&p.lz)lz.value=p.lz;};
  sel.addEventListener('change',upd);
  btn.addEventListener('click',()=>{
    const p=PRODMAP[sel.value];if(!p||!parseFloat(betrag.value)){toast('Produkt und Betrag angeben');return;}
    const it={k:sel.value,betrag:parseFloat(betrag.value),zw:zw.value,ts:new Date().toISOString()}; // ts = Basis der EH-Monatszahlen (v10.11-K)
    if(p.lz)it.lz=parseFloat(lz.value)||p.lz;
    if(p.mode==='fin')it.bag=parseFloat(bag.value)||0;
    (which==='s'?d.ehS:d.ehA).push(it);betrag.value='';if(state.deals.includes(d))dbPersist(d);paintEH(m,d);
  });
  [sel,betrag,zw,lz,bag,btn].forEach(x=>host.appendChild(x));upd();
}
function paintEH(m,d){
  const ls=m.querySelector('#eh-list-s'),la=m.querySelector('#eh-list-a'),tot=m.querySelector('#eh-tot');if(!ls)return;
  const row=(it,w,i)=>{const p=PRODMAP[it.k];const e=calcEH(it);return `<div class="ehrow"><span class="nm">${p?esc(p.n):esc(it.k)}</span><span>${it.betrag} €${(p&&!p.mode)?(it.zw==='j'?'/J':'/M'):''}${(p&&p.lz&&it.lz)?' · '+it.lz+' J':''}</span><span class="val">${fmtEH(e)} EH</span><button class="rm" data-w="${w}" data-i="${i}">×</button></div>`;};
  ls.innerHTML=d.ehS.length?d.ehS.map((it,i)=>row(it,'s',i)).join(''):'<div style="font-size:11.5px;color:var(--ink-3);margin-bottom:5px">Noch nichts geschätzt.</div>';
  la.innerHTML=d.ehA.length?d.ehA.map((it,i)=>row(it,'a',i)).join(''):'<div style="font-size:11.5px;color:var(--ink-3);margin-bottom:5px">Noch kein Abschluss eingepflegt.</div>';
  m.querySelectorAll('.ehrow .rm').forEach(b=>b.addEventListener('click',()=>{(b.dataset.w==='s'?d.ehS:d.ehA).splice(+b.dataset.i,1);if(state.deals.includes(d))dbPersist(d);paintEH(m,d);}));
  const sS=d.ehS.reduce((s,it)=>s+calcEH(it),0), sA=d.ehA.reduce((s,it)=>s+calcEH(it),0);
  const bt=beteiligung(d),anP=bt.an;
  const tS=m.querySelector('#eh-tot-s');
  if(tS)tS.innerHTML=sS>0?`🎯 Potenzial ≈ ${fmtEH(sS)} EH <span style="font-weight:600;color:var(--ink-2)">· Analyst ${anP} % ≈ ${fmtEH(sS*anP/100)}${bt.p?` · ${esc(bt.name)} ${bt.p} % ≈ ${fmtEH(sS*bt.p/100)}`:''} · Berater ${bt.be} % ≈ ${fmtEH(sS*bt.be/100)}</span>`:'';
  tot.innerHTML=`<span>Schätzung: <b>${fmtEH(sS)} EH</b></span><span>Abschluss: <b>${fmtEH(sA)} EH</b></span>`+(sA?`<span>Analyst (${anP} %): <b>${fmtEH(sA*anP/100)} EH</b></span>${bt.p?`<span>${esc(bt.name)} (${bt.p} %): <b>${fmtEH(sA*bt.p/100)} EH</b></span>`:''}<span>Berater (${bt.be} %): <b>${fmtEH(sA*bt.be/100)} EH</b></span>`:'');
}

function parseCSV(text){
  text=text.replace(/^﻿/,'');const rows=[];let f='',row=[],q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
    else{if(c==='"')q=true;else if(c===','){row.push(f);f='';}else if(c==='\n'){row.push(f);rows.push(row);row=[];f='';}else if(c==='\r'){}else f+=c;}
  }
  if(f.length||row.length){row.push(f);rows.push(row);}
  return rows.filter(r=>r.some(x=>x.trim()!==''));
}
async function importCSV(text){
  const rows=parseCSV(text);if(!rows.length){toast('Leere Datei');return;}
  const head=rows[0].map(h=>h.trim());const idx=n=>head.indexOf(n);
  const isBestand=idx('Pipedrive_Stage')>=0, isRech=idx('Firma')>=0;
  let added=0,merged=0;
  const touched=[];
  const phoneIdx={};state.deals.forEach(x=>{const p=(x.telefon||'').replace(/\D/g,'');if(p.length>=8)phoneIdx[p]=x;});
  for(let i=1;i<rows.length;i++){const r=rows[i];const g=n=>{const k=idx(n);return k>=0?(r[k]||'').trim():'';};
    let d=blank();
    if(isRech)d.geprueft=false;
    if(isBestand){
      d.kundentyp=g('Kundentyp')||'Privat';d.org=g('Organisation');d.name=g('Name');d.telefon=g('Telefon');d.ort=g('Ort');
      d.email=g('Email')||g('E-Mail');d.strasse=g('Strasse');d.plz=g('PLZ');
      d.bezirk=g('Bezirk')||bezFromPLZ(g('PLZ'))||bezFromPLZ(g('Ort'));d.telefonist=canonName(g('Telefonist'))||d.telefonist;
      if(g('Wiedervorlage'))d.wiedervorlage=g('Wiedervorlage');
      d.quelle=g('Quelle')||'Bestand';d.analyst=canonName(g('Analyst'));d.berater=canonName(g('Berater'));
      d.stage=g('Pipedrive_Stage')||'Neuer Lead';d.status=g('Pipedrive_Status')||'open';d.lostReason=g('Lost_Reason');
      d.datumAG=g('Datum_AG');d.datumBG=g('Datum_BG');d.eh=g('EH');d.notizen=g('Notizen');
    }else if(isRech){
      d.kundentyp='GmbH';d.org=g('Firma');d.name=g('Ansprechpartner_GF')||g('Firma');d.telefon=g('Telefon');
      d.email=g('Email')||g('E-Mail');
      d.ort=g('Ort');d.bezirk=g('Bezirk')||bezFromPLZ(g('PLZ'));d.strasse=g('Strasse');d.plz=g('PLZ');
      d.quelle=g('Quelle')||'Recherche';if(d.quelle==='Recruiting'){d.gp=true;d.kundentyp='Privat';}
      d.stage='Neuer Lead';d.status='open';d.notizen=g('Branche');d.branche=(g('Branche')||'').split('|')[0].trim();
      d.umsatz=g('Umsatz_EUR');d.gewinn=g('Gewinn_EUR');d.anlage=g('Anlagevermoegen_EUR');d.finanzJahr=g('Finanz_Jahr');
      d.website=g('Website');d.maGroesse=g('MA_Groesse');
      if(g('Quelle_Detail'))d.briefing=g('Quelle_Detail');
      if(g('Finanz_Quelle'))d.notizen+=(d.notizen?' | ':'')+'Finanzdaten: '+g('Finanz_Quelle')+(g('Finanz_Jahr')?' ('+g('Finanz_Jahr')+')':'');
    }else{ d.name=r[0]||''; }
    if(!STAGES.includes(d.stage)&&d.status==='open')d.stage='Neuer Lead';
    if(!(d.name||d.org))continue;
    d.telefon=normTel(d.telefon);
    const pp=(d.telefon||'').replace(/\D/g,'');
    const ex=pp.length>=8?phoneIdx[pp]:null;
    if(ex){
      ['telefonist','bezirk','ort','org','umsatz','gewinn','anlage','sachanlage','finanzanlage','finanzJahr','website','maGroesse','briefing','email','strasse','plz','analyst','berater'].forEach(f=>{if(d[f]&&!ex[f])ex[f]=d[f];});
      if(d.wiedervorlage&&!ex.wiedervorlage)ex.wiedervorlage=d.wiedervorlage;
      if(d.notizen&&!(ex.notizen||'').includes(d.notizen))ex.notizen=(ex.notizen?ex.notizen+' | ':'')+'[Setter] '+d.notizen;
      touched.push(ex);merged++;continue;
    }
    state.deals.push(d);if(pp.length>=8)phoneIdx[pp]=d;touched.push(d);added++;
  }
  render();
  if(MODE==='db'&&touched.length){
    toast('Speichere '+touched.length+' Datensätze in der Datenbank…');
    const ok=await dbPersistMany(touched);
    toast(ok?(added+' importiert'+(merged?', '+merged+' zusammengeführt':'')+' ✓'+(isRech?' → Steuerung → 🗺️ Bezirks-Zuteilung':'')):'Import-Speicherung fehlgeschlagen – bitte erneut importieren');
  }else{
    lsSave();
    toast(added+' importiert'+(merged?', '+merged+' mit bestehenden Kunden zusammengeführt':'')+(isRech?' → Steuerung → 🗺️ Bezirks-Zuteilung':''));
  }
}
document.getElementById('fileIn').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{
  if(/\.json$/i.test(f.name)){
    try{
      const arr=JSON.parse(rd.result);
      if(!Array.isArray(arr)){toast('Ungültiges Backup-Format');return;}
      if(confirm('Backup mit '+arr.length+' Datensätzen wiederherstellen?\n\nDies ERSETZT die aktuellen '+state.deals.length+' Datensätze komplett.')){
        (async()=>{
          if(MODE==='db'&&dealsCol){
            const oldIds=state.deals.map(x=>x.id);
            const newIds=new Set(arr.map(x=>x.id));
            state.deals=arr;render();
            toast('Stelle '+arr.length+' Datensätze in der Datenbank wieder her…');
            for(const id of oldIds){if(!newIds.has(id)){try{await dealsCol.doc(id).delete();}catch(e){}}}
            let ok=0;for(const dd of arr){try{await dealsCol.doc(dd.id).set(JSON.parse(JSON.stringify(dd)));ok++;}catch(e){}}
            toast('Backup wiederhergestellt: '+ok+'/'+arr.length+' Datensätze');
          }else{
            state.deals=arr;lsSave();render();toast('Backup wiederhergestellt: '+arr.length+' Datensätze');
          }
        })();
      }
    }catch(err){toast('Backup konnte nicht gelesen werden');}
  }else{importCSV(rd.result);}
};rd.readAsText(f,'UTF-8');e.target.value='';});

}

/* ---------- init: Firebase Anmeldung + Datenbank ---------- */
lsLoad();render();
(function(){
  if(!window.firebase){setDbState('🔴 Firebase-Bibliothek nicht geladen (Internet?)','var(--bad)');return;}
  if(!FIREBASE_CONFIG.apiKey||FIREBASE_CONFIG.apiKey==='HIER_EINFUEGEN'){setDbState('⚙️ Firebase-Konfiguration fehlt','var(--warn)');return;}
  firebase.initializeApp(FIREBASE_CONFIG);
  const auth=firebase.auth();
  const fs=firebase.firestore();
  dealsCol=fs.collection('deals');
  teamCol=fs.collection('team');
  const errDe=e=>{const c=(e&&e.code)||'';
    if(c.indexOf('invalid-credential')>=0||c.indexOf('wrong-password')>=0||c.indexOf('user-not-found')>=0)return 'E-Mail oder Passwort falsch';
    if(c.indexOf('too-many-requests')>=0)return 'Zu viele Versuche – bitte kurz warten';
    if(c.indexOf('network')>=0)return 'Keine Internet-Verbindung';
    if(c.indexOf('invalid-email')>=0)return 'Ungültige E-Mail-Adresse';
    return 'Anmeldung fehlgeschlagen ('+(c||'unbekannt')+')';};
  const doLogin=async()=>{
    const em=document.getElementById('loginEmail').value.trim();
    const pw=document.getElementById('loginPw').value;
    const errEl=document.getElementById('loginErr');errEl.textContent='';
    if(!em||!pw){errEl.textContent='Bitte E-Mail und Passwort eingeben';return;}
    const btn=document.getElementById('loginBtn');btn.disabled=true;btn.textContent='Anmelden…';
    try{await auth.signInWithEmailAndPassword(em,pw);}catch(e){errEl.textContent=errDe(e);}
    btn.disabled=false;btn.textContent='Anmelden';
  };
  document.getElementById('loginBtn').addEventListener('click',doLogin);
  document.getElementById('pwReset').addEventListener('click',async()=>{
    const em=document.getElementById('loginEmail').value.trim();
    const errEl=document.getElementById('loginErr');
    if(!em){errEl.textContent='Bitte zuerst oben deine E-Mail eintragen, dann auf „Passwort vergessen?" klicken.';return;}
    try{
      await auth.sendPasswordResetEmail(em);
      errEl.style.color='var(--good)';
      errEl.textContent='✅ E-Mail ist unterwegs an '+em+' – Link anklicken, neues Passwort setzen, hier anmelden. (Auch im Spam-Ordner schauen!)';
    }catch(e){errEl.style.color='var(--bad)';errEl.textContent=errDe(e);}
  });
  document.getElementById('loginPw').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
  document.getElementById('loginEmail').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
  let unsubDeals=null,unsubTeam=null;
  auth.onAuthStateChanged(async u=>{
    AUTH_USER=u||null;
    if(unsubDeals){unsubDeals();unsubDeals=null;}
    if(unsubTeam){unsubTeam();unsubTeam=null;}
    if(chatUnsub){chatUnsub();chatUnsub=null;}
    if(actUnsub){actUnsub();actUnsub=null;}
    if(!u){
      MODE='local';ME=null;TEAM=[];state.deals=[];CHAT=[];ACT=[];__lastAct=0;WOCHE=[];WOCHE_WK='';__wPerson='';__wTeam=false;__todoShown=false;updateChatLog();updateChatBadge();updateTodoBadge();
      setDbState('🔑 Bitte anmelden','var(--warn)');
      applyRoleUI();render();showLogin();
      return;
    }
    hideLogin();
    setDbState('🔐 Lade Daten…','var(--warn)');
    try{
      try{await fs.enablePersistence({synchronizeTabs:true});}catch(e){}
      const t0=await ladeStart(teamCol,200);
      TEAM=t0.docs.map(s=>{const m=Object.assign({},s.data()||{});m.id=s.id;return m;});
      const blitz=await blitzGet();
      if(blitz&&blitz.length){ // Blitz-Start: letzten Stand SOFORT zeigen, Live-Daten kommen per onSnapshot nach
        MODE='db';
        state.deals=blitz.map(o=>Object.assign(blank(),o));
        matchMe();
        setDbState('🟡 Schnellstart · '+state.deals.length+' · Live-Abgleich läuft …','var(--warn)');
        applyRoleUI();render();
      }else{
        const s0=await ladeStart(dealsCol,10000);
        MODE='db';
        state.deals=s0.docs.map(s=>{const b=Object.assign(blank(),s.data());b.id=s.id;return b;});
        matchMe();
        setDbState('🟢 CENSA-DB · '+state.deals.length,'var(--good)');
        applyRoleUI();render();
      }
      if(!ME&&TEAM.length&&!isAdmin())toast('Deine E-Mail ist keinem Zugang zugeordnet – bitte beim Admin melden');
      window.__dealsInit=false;
      unsubDeals=dealsCol.limit(10000).onSnapshot(snap=>{
        MODE='db';
        if(!window.__dealsInit){ // erster Live-Schnappschuss: komplett übernehmen
          window.__dealsInit=true;
          state.deals=snap.docs.map(s=>{const b=Object.assign(blank(),s.data());b.id=s.id;return b;});
        }else{ // danach NUR die Änderungen einarbeiten – bei 7.000+ Kunden spart das den teuren Voll-Neuaufbau je Ereignis
          const pos={};state.deals.forEach((d,i)=>pos[d.id]=i);
          let removed=false;
          snap.docChanges().forEach(ch=>{
            const id=ch.doc.id;
            if(ch.type==='removed'){if(pos[id]!=null){state.deals[pos[id]].__del=true;removed=true;}return;}
            const b=Object.assign(blank(),ch.doc.data());b.id=id;
            if(pos[id]!=null)state.deals[pos[id]]=b;else{pos[id]=state.deals.length;state.deals.push(b);}
          });
          if(removed)state.deals=state.deals.filter(d=>!d.__del);
        }
        setDbState('🟢 CENSA-DB · '+state.deals.length,'var(--good)');
        scheduleRender();
        blitzSave(); // Blitz-Cache fürs nächste Öffnen aktuell halten
      },err=>{setDbState('🟠 Live-Sync unterbrochen – neu laden hilft','var(--warn)');});
      unsubTeam=teamCol.limit(200).onSnapshot(snap=>{
        TEAM=snap.docs.map(s=>{const m=Object.assign({},s.data()||{});m.id=s.id;return m;});
        onTeamUpdate();
      },err=>{});
      chatCol=fs.collection('chat');
      ensureChatUI();
      chatUnsub=chatCol.orderBy('ts','desc').limit(200).onSnapshot(snap=>{
        CHAT=snap.docs.map(s=>{const x=Object.assign({},s.data());x._id=s.id;return x;}).reverse();
        aufgabenPutz(); // hinfällige Urgenz-Aufgaben automatisch schließen (vor der Urgenz-Prüfung)
        zuordUrgenz(); // 3-Std-Urgenz prüfen (Admin-Sitzungen, max. alle 15 Min)
        if(isAdmin())markDirty('steuerung'); // Zuordnungs-Status-Panel aktuell halten
        updateChatLog();updateTodoBadge();
        if(!__todoShown&&!__todoTimer)todoAutoStart();
      },err=>{});
      wocheCol=fs.collection('woche');WOCHE_WK='';
      setTimeout(wochePreload,1500);
      actCol=fs.collection('activity');
      logActivity();
      actUnsub=actCol.orderBy('ts','desc').limit(1500).onSnapshot(snap=>{
        ACT=snap.docs.map(s=>s.data());
        if(isAdmin())markDirty('steuerung');
      },err=>{});
      if(window.__setUnsub){try{window.__setUnsub();}catch(e){}}
      window.__setUnsub=fs.collection('meta').doc('settings').onSnapshot(s=>{
        const v=(s.exists&&(s.data()||{}).vmMail)||'';
        if(v){VM_MAIL=v;try{localStorage.setItem('censa_vm_mail',v);}catch(e){}}
      },err=>{});
      metaUnsub=fs.collection('meta').doc('stats').onSnapshot(s=>{
        STATS_SINCE=(s.exists&&(s.data()||{}).since)||'';
        if(isAdmin())markDirty('steuerung');
      },err=>{});
      todoAutoStart(); // Aufgaben-Fenster beim Anmelden
      setTimeout(ehgAutoRemind,5000);
      setTimeout(wgCheck,9000);if(!window.__wgTimer)window.__wgTimer=setInterval(wgCheck,300000);
      setTimeout(inboxImport,4000);
  setTimeout(slotsCleanup,7000); // Lead-Briefkasten (Routinen/Zahlen-Läufe) automatisch übernehmen
  setTimeout(gebietFill,15000); // Gebiete (Bundesland/Wien-Bezirk) für Bestandskunden ohne Bezirk nachtragen
      buchCol=fs.collection('buchungen');
      buchUnsub=buchCol.orderBy('ts','desc').limit(80).onSnapshot(snap=>{
        BUCH=snap.docs.map(s=>{const x=Object.assign({},s.data());x._id=s.id;return x;});
        if(isAdmin())markDirty('steuerung');
      },err=>{});
    }catch(e){
      setDbState('🔴 '+((e&&e.code)||'Fehler')+' – kein Datenzugriff','var(--bad)');
      toast('Datenzugriff fehlgeschlagen: '+((e&&e.code)||'unbekannt'));
    }
  });
})();
